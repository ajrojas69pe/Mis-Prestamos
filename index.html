<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Préstamos — Control Personal</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Préstamos" />
<meta name="theme-color" content="#172033" />
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
  :root {
    --font-sans: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
    --font-mono: 'DM Mono', ui-monospace, monospace;
    --bg: #EFF5FB;
    --surface: #FFFFFF;
    --surface2: #F6F9FC;
    --surface3: #F0F4F9;
    --border: #E2E8F0;
    --border2: #CBD5E1;
    --text: #172033;
    --text2: #4A5568;
    --text3: #94A3B8;
    --accent: #1F4E79;
    --accent-soft: #E8F1F8;
    --green: #167A5B;
    --green-soft: #E7F6EF;
    --red: #B42318;
    --red-soft: #FDECEC;
    --orange: #B54708;
    --orange-soft: #FFF2DD;
    --blue: #1F4E79;
    --blue-soft: #E8F1F8;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 3px rgba(16,24,40,0.07);
    --shadow: 0 4px 16px rgba(16,24,40,0.08);
    --shadow-lg: 0 10px 32px rgba(16,24,40,0.10);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: linear-gradient(180deg, #E4EEF7 0, #EFF5FB 280px, #F6F9FC 100%);
    color: var(--text); min-height: 100vh; font-size: 14px;
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top); /* Soporte iPhone Notch */
  }

  /* ── TOPBAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 200;
    background: rgba(23,32,51,0.97); backdrop-filter: blur(10px);
    height: 54px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  .topbar-brand { display: flex; align-items: center; gap: 10px; }
  .topbar-logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #1F4E79, #167A5B);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: #fff;
  }
  .topbar-name { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }
  .topbar-sub  { font-size: 11px; color: rgba(255,255,255,0.45); font-family: var(--font-mono); }
  .topbar-status { display:flex; align-items:center; gap:6px; font-size:11px; font-family:var(--font-mono); }
  .status-dot { width:8px; height:8px; border-radius:50%; background:#94A3B8; }
  .status-dot.online  { background:#22C55E; box-shadow:0 0 6px #22C55E; }
  .status-dot.offline { background:#EF4444; }
  .status-label { color:rgba(255,255,255,0.5); }

  /* ── LAYOUT ── */
  .app { width: min(1160px, calc(100% - 20px)); margin: 0 auto; padding: 16px 0 48px; }

  /* ── PAGE HEADER ── */
  .page-header {
    background: linear-gradient(135deg, rgba(255,255,255,0.97) 60%, rgba(232,241,248,0.9));
    border: 1px solid rgba(215,222,232,0.8); border-radius: var(--radius-lg);
    padding: 14px 16px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; box-shadow: var(--shadow);
  }
  .page-header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px; }
  .page-header h1 .h-icon {
    width: 34px; height: 34px; border-radius: 10px; background: #173B5C; color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .page-header p { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .header-actions { display: flex; gap: 8px; align-items: center; width: 100%; justify-content: space-between; }
  .header-actions button { flex: 1; justify-content: center; }

  /* ── BUTTONS ── */
  button { font-family: var(--font-sans); cursor: pointer; transition: all 0.16s ease; -webkit-tap-highlight-color: transparent; }
  button:active { transform: translateY(1px) !important; }
  .btn { border: none; border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .btn-primary { background: #173B5C; color: #fff; box-shadow: 0 4px 14px rgba(23,59,92,0.2); }
  .btn-primary:hover { background: #0F2D4A; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border2); }
  .btn-success { background: var(--green-soft); color: var(--green); border: 1px solid #B9E6D1; }
  .btn-info { background: var(--blue-soft); color: var(--blue); border: 1px solid #BED5E8; }
  .btn-danger-soft { background: var(--red-soft); color: var(--red); border: 1px solid #F8C8C4; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid transparent; padding: 7px 12px; }
  .btn-ghost-danger { background: transparent; color: var(--red); border: 1px solid transparent; padding: 7px 12px; border-radius: var(--radius); }
  .btn-icon { background: transparent; border: 1px solid transparent; padding: 8px; border-radius: 8px; color: var(--text2); font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
  .btn-icon:hover, .btn-icon:active { background: var(--surface3); color: var(--text); }
  .btn-icon.danger:active { background: var(--red-soft); color: var(--red); }
  .btn-icon.success:active { background: var(--green-soft); color: var(--green); }
  .btn-icon.whatsapp { background: #E7F6EF; color: #22C55E; border-color: #B9E6D1; }

  /* ── STATS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 12px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  }
  .stat-card::before { content:''; position:absolute; inset:0 0 auto 0; height:3px; background:var(--sc-color, var(--accent)); }
  .stat-card .sc-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .stat-card .sc-label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-card .sc-icon { width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--sc-bg,var(--accent-soft));color:var(--sc-color,var(--accent)); }
  .stat-card .sc-val { font-size:18px; font-weight:700; letter-spacing:-0.3px; }
  .stat-card .sc-hint { font-size:11px; color:var(--text3); margin-top:2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-card.warning { --sc-color: var(--orange); --sc-bg: var(--orange-soft); }
  .stat-card.danger  { --sc-color: var(--red);    --sc-bg: var(--red-soft); }
  .stat-card.success { --sc-color: var(--green);  --sc-bg: var(--green-soft); }
  .stat-card.info    { --sc-color: var(--blue);   --sc-bg: var(--blue-soft); }

  /* ── PANEL ── */
  .panel { background: var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
  .panel-title { font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .panel-title i { color:var(--accent); font-size:18px; }

  /* ── FORM ── */
  .form-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:12px; font-weight:600; color:var(--text2); }
  .field input, .field select {
    padding: 10px 12px; border: 1px solid var(--border2); border-radius: var(--radius);
    background: #fff; color: var(--text); font-size: 14px; font-family: var(--font-sans);
    transition: border-color 0.15s; -webkit-appearance: none;
  }
  .field input:focus { outline:none; border-color:#2E6E9E; }
  .field input.invalid { border-color: var(--red) !important; background-color: #FFF5F5; }

  /* ── CALC BAR ── */
  .calc-bar {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 8px;
    margin-top: 12px; padding: 8px; background: var(--surface2); border-radius: 10px;
  }
  .calc-item { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
  .calc-item .ci-label { font-size:9px; font-weight:600; color:var(--text3); text-transform:uppercase; }
  .calc-item .ci-val { font-size:13px; font-weight:700; color:var(--text); font-family:var(--font-mono); margin-top:2px; }
  .calc-item .ci-val.green { color:var(--green); }

  /* ── PAYMENT TIPO BTNS ── */
  .pago-tipo-btn {
    flex: 1; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 10px 6px; border-radius: var(--radius); border: 1.5px solid var(--border2);
    background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 600; gap: 4px;
  }
  .pago-tipo-btn small { font-weight: 400; font-size: 9px; opacity: 0.8; }
  .pago-tipo-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ── PAYMENT SUMMARY ── */
  .payment-summary {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 6px;
    margin-top: 12px; padding: 8px; background: var(--surface2); border-radius: 10px;
  }
  .payment-summary > div { background:#fff; border:1px solid var(--border); border-radius:8px; padding:8px; text-align: center; }
  .payment-summary .ps-label { font-size:9px; font-weight:600; color:var(--text3); text-transform:uppercase; }
  .payment-summary .ps-val { font-size:12px; font-weight:700; font-family:var(--font-mono); margin-top:2px; }

  /* ── FILTERS ── */
  .filter-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .search-input {
    flex:1; padding:10px 12px; border:1px solid var(--border2);
    border-radius:var(--radius); background:#fff; color:var(--text); font-size:13px;
  }
  .filter-select {
    padding:10px 10px; border:1px solid var(--border2); border-radius:var(--radius);
    background:#fff; color:var(--text); font-size:13px; max-width: 130px;
  }

  /* ── TABLE / LIST RESPONSIVE FOR MOBILE ── */
  .table-wrap { border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  table { width:100%; border-collapse:collapse; }
  
  /* Escondemos columnas secundarias en móviles para que no se rompa la pantalla */
  th:nth-child(4), td:nth-child(4),
  th:nth-child(5), td:nth-child(5),
  th:nth-child(6), td:nth-child(6),
  th:nth-child(8), td:nth-child(8) { display: none; }

  th { font-size:10px; font-weight:700; color:#526071; padding:10px 8px; border-bottom:1px solid var(--border); background:#F7FAFD; text-transform:uppercase; }
  td { padding:12px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .td-mono { font-family:var(--font-mono); font-size:11px; }
  .td-name { font-weight:600; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .td-mora { font-size:10px; color:var(--red); font-family:var(--font-mono); font-weight: 700; }

  /* ── BADGES ── */
  .badge { display:inline-flex; align-items:center; justify-content:center; min-width:65px; font-size:10px; font-weight:700; padding:3px 6px; border-radius:999px; }
  .badge-active  { background:var(--green-soft); color:var(--green); }
  .badge-paid    { background:var(--blue-soft);  color:var(--blue); }
  .badge-late    { background:var(--red-soft);   color:var(--red); }
  .badge-due     { background:var(--orange-soft);color:var(--orange); }

  /* ── DETAIL CARD ── */
  .detail-overlay { display:none; }
  .detail-overlay.show { display:block; }
  .detail-card {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: var(--radius-lg); padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow-lg);
  }
  .detail-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .detail-name { font-size:18px; font-weight:700; }
  .detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
  .detail-item { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; }
  .detail-item .di-label { font-size:9px; color:var(--text3); font-weight:600; text-transform:uppercase; }
  .detail-item .di-val { font-size:12px; font-weight:700; font-family:var(--font-mono); margin-top:2px; }
  .di-val.green { color:var(--green); }
  .di-val.red   { color:var(--red); }
  .di-val.orange{ color:var(--orange); }
  
  .progress-bg { background:#E8EEF5; border-radius:999px; height:7px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill { height:100%; background:linear-gradient(90deg, var(--green), var(--accent)); }
  .progress-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--text3); margin-bottom:12px; }
  .detail-actions { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .detail-actions button { width:100%; justify-content:center; padding:11px; }

  /* ── PAGOS ── */
  .pagos-title { font-size:12px; font-weight:700; color:var(--text2); margin:12px 0 6px; }
  .pago-row { display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; margin-bottom:6px; font-size:12px; }
  .pago-row .pr-date { font-family:var(--font-mono); color:var(--text3); }
  .pago-row .pr-amt  { font-weight:700; font-family:var(--font-mono); color:var(--green); }
  .pago-row .pr-note { color:var(--text2); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ── EMPTY / TOAST ── */
  .empty-state { text-align:center; padding:32px 10px; color:var(--text3); }
  #loadingOverlay { position:fixed; inset:0; z-index:9999; background:rgba(23,32,51,0.96); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:#fff; }
  .spinner { width:36px; height:36px; border:3px solid rgba(255,255,255,0.15); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  
  #toast {
    position:fixed; bottom:16px; left:16px; right:16px; z-index:9999;
    background:#172033; color:#fff; padding:12px; border-radius:var(--radius);
    font-size:12px; text-align:center; opacity:0; transition:all 0.22s; pointer-events:none;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size:15px;font-weight:600;">Cargando Control Personal...</div>
  <div style="font-size:12px;color:rgba(255,255,255,0.5);" id="loadingMsg">Sincronizando base de datos</div>
</div>

<div class="topbar">
  <div class="topbar-brand">
    <div class="topbar-logo"><i class="ti ti-coin"></i></div>
    <div>
      <div class="topbar-name">Control Personal</div>
      <div class="topbar-sub" id="topDate"></div>
    </div>
  </div>
  <div class="topbar-status">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Cargando...</span>
  </div>
</div>

<div class="app">

  <div class="page-header">
    <div style="width:100%; margin-bottom:8px;">
      <h1><span class="h-icon"><i class="ti ti-device-mobile"></i></span> Mis Préstamos</h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="exportCSV()"><i class="ti ti-file-spreadsheet"></i> CSV</button>
      <button class="btn btn-primary" onclick="showForm()"><i class="ti ti-plus"></i> Nuevo préstamo</button>
    </div>
  </div>

  <div class="stats-grid" id="statsGrid"></div>

  <div class="panel" id="formPanel" style="display:none;">
    <div class="panel-title"><i class="ti ti-forms"></i> <span id="formTitle">Nuevo préstamo</span></div>
    <div class="form-grid">
      <div class="field">
        <label>Cliente</label>
        <input type="text" id="fCliente" placeholder="Nombre del deudor" />
      </div>
      <div class="field">
        <label>Número de WhatsApp</label>
        <input type="tel" id="fMovil" placeholder="Ej: 51999888777" />
      </div>
      <div class="field">
        <label>Fecha inicial</label>
        <input type="date" id="fFecha" oninput="calcPreview()" />
      </div>
      <div class="field">
        <label>Monto prestado (S/)</label>
        <input type="number" id="fMonto" placeholder="0.00" step="0.01" oninput="calcPreview()" />
      </div>
      <div class="field">
        <label>Interés Mensual (%)</label>
        <input type="number" id="fTasa" placeholder="%" step="0.1" oninput="calcPreview()" />
      </div>
      <div class="field">
        <label>Plazo total (días)</label>
        <input type="number" id="fPlazo" value="30" oninput="calcPreview()" />
      </div>
      <div class="field">
        <label>Fecha límite de pago</label>
        <input type="date" id="fFechaPago" />
      </div>
    </div>
    <div class="calc-bar">
      <div class="calc-item"><div class="ci-label">Int. Mes</div><div class="ci-val" id="prevInteres">S/ 0</div></div>
      <div class="calc-item"><div class="ci-label">Int. Día</div><div class="ci-val" id="prevDiario">S/ 0</div></div>
      <div class="calc-item"><div class="ci-label">Total</div><div class="ci-val green" id="prevTotal">S/ 0</div></div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
      <button class="btn btn-ghost" onclick="hideForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveRecord()"><i class="ti ti-device-floppy"></i> Guardar</button>
    </div>
  </div>

  <div class="detail-overlay" id="detailOverlay"></div>

  <div class="panel" id="paymentPanel" style="display:none;">
    <div class="panel-title"><i class="ti ti-cash"></i> Cobrar — <span id="pagoClienteNombre" style="color:var(--text2)"></span></div>
    <input type="hidden" id="fPagoId" />
    <div style="display:flex;gap:6px;margin-bottom:12px;">
      <button class="pago-tipo-btn active" id="btnTipoIntereses" onclick="setTipoPago('intereses')"><i class="ti ti-refresh"></i>Solo Int.</button>
      <button class="pago-tipo-btn" id="btnTipoParcial" onclick="setTipoPago('parcial')"><i class="ti ti-calculator"></i>Abono Cap.</button>
      <button class="pago-tipo-btn" id="btnTipoTotal" onclick="setTipoPago('total')"><i class="ti ti-check"></i>Liquidar</button>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Fecha de hoy</label>
        <input type="date" id="fPagoFecha" oninput="recalcPago()" />
      </div>
      <div class="field">
        <label>Monto Recibido (S/)</label>
        <input type="number" id="fPagoMonto" step="0.01" oninput="recalcPagoManual()" />
      </div>
      <div class="field">
        <label>Comentario corto</label>
        <input type="text" id="fPagoNota" placeholder="Ej: Efectivo, transferencia..." />
      </div>
    </div>
    <div class="payment-summary">
      <div><div class="ps-label">Días trans.</div><div class="ps-val" id="pagoDias">0</div></div>
      <div><div class="ps-label">Int. generado</div><div class="ps-val" id="pagoInteresHoy">S/ 0</div></div>
      <div><div class="ps-label">Cap. actual</div><div class="ps-val" id="pagoCapital">S/ 0</div></div>
    </div>
    <div style="font-size:11px;color:var(--text2);margin-top:6px;background:#fff;padding:6px;border-radius:6px;" id="pagoExplicacion"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
      <button class="btn btn-ghost" onclick="hidePaymentForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePayment()">Procesar Pago</button>
    </div>
  </div>

  <div class="panel">
    <div class="filter-row">
      <input class="search-input" type="text" id="searchInput" placeholder="🔍 Buscar deudor..." oninput="renderTable()" />
      <select class="filter-select" id="filterStatus" onchange="renderTable()">
        <option value="">Todos</option>
        <option value="activo">Activos</option>
        <option value="por_vencer">Avisos</option>
        <option value="vencido">⚠️ Mora</option>
        <option value="pagado">Pagados</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Monto</th>
            <th>Vence</th>
            <th>Int. Hoy</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No se encontraron registros</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCBDkCLZAsqWNNc3j_uuOzDiQct14H3ioY",
    authDomain:        "misprestamos-9fc6c.firebaseapp.com",
    projectId:         "misprestamos-9fc6c",
    storageBucket:     "misprestamos-9fc6c.firebasestorage.app",
    messagingSenderId: "347829135506",
    appId:             "1:347829135506:web:7804117505a18da3969e4b"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);
  const COL = "prestamos";

  window._fsWrite = async (record) => { await setDoc(doc(db, COL, record.id), record); };
  window._fsDelete = async (id) => { await deleteDoc(doc(db, COL, id)); };

  onSnapshot(collection(db, COL), (snapshot) => {
    window._records = snapshot.docs.map(d => {
      const data = d.data();
      return { id: d.id, ...data, pagos: data.pagos || [] };
    });
    records = window._records;
    renderAll();
    document.getElementById('loadingOverlay').style.display = 'none';
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('statusLabel').textContent = 'Sincronizado';
  }, (err) => {
    document.getElementById('statusDot').className = 'status-dot offline';
    document.getElementById('statusLabel').textContent = 'Desconectado';
  });
</script>

<script>
let records = [];
let editingId = null;
let tipoPago = 'intereses';

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(d) { return d ? d.split('-').reverse().join('/') : '—'; }
function fmtCurrency(n) { return 'S/ ' + Number(n||0).toFixed(1); }
function escHtml(v) { return String(v||''); }
function daysDiff(a, b) {
  if (!a || !b) return 0;
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000) || 0;
}
function addDays(dateStr, n) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getFechaRef(r) {
  const v = (r.pagos||[]).filter(p => p.tipo === 'intereses' || p.tipo === 'parcial');
  return v.length > 0 ? v[v.length-1].fecha : r.fecha;
}
function getInteresHasta(r, f) {
  const diario = r.monto * (r.tasa / 100) / 30;
  return diario * Math.max(0, daysDiff(getFechaRef(r), f));
}
function getTotalCobrado(r) { return (r.pagos||[]).reduce((s, p) => s + (Number(p.monto)||0), 0); }
function isCanceled(r) { return r.pagado || (r.pagos||[]).some(p => p.tipo === 'total'); }

function calcStatus(r) {
  if (isCanceled(r)) return 'pagado';
  const d = daysDiff(today(), r.fechaPago);
  if (d < 0) return 'vencido';
  if (d <= 3) return 'por_vencer';
  return 'activo';
}

const STATUS_LABEL = { activo:'Activo', pagado:'Pagado', vencido:'Mora', por_vencer:'Aviso' };
const STATUS_CLASS = { activo:'badge-active', pagado:'badge-paid', vencido:'badge-late', por_vencer:'badge-due' };

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show';
  setTimeout(() => el.className = '', 2000);
}

// FORMATO DE ALERTA DE DIAS VENCIDOS E INTERESES DIARIOS POR WHATSAPP
function dispararRecordatorioMora(id) {
  const r = records.find(x => x.id === id); if (!r || !r.movil) return;
  const num = r.movil.replace(/\D/g, '');
  const ref = getFechaRef(r);
  const dias = Math.max(0, daysDiff(ref, today()));
  const diario = r.monto * (r.tasa / 100) / 30;
  const acum = diario * dias;

  let txt = `*CONTROL PERSONAL — AVISO DE MORA*\n\n`;
  txt += `Hola *${r.cliente}*, te informamos el cálculo de intereses devengados al día de hoy:\n\n`;
  txt += `📉 *Capital Restante:* ${fmtCurrency(r.monto)}\n`;
  txt += `⏳ *Días transcurridos:* ${dias} días de retraso\n`;
  txt += `💵 *Interés por día:* ${fmtCurrency(diario)}\n`;
  txt += `⚠️ *Total Intereses hoy:* ${fmtCurrency(acum)}\n\n`;
  txt += `Por favor, sírvase abonar para frenar la acumulación diaria. ¡Muchas gracias!`;

  window.open(`https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(txt)}`, '_blank');
}

function showForm(id) {
  editingId = id || null;
  hidePaymentForm(); closeDetail();
  if (id) {
    const r = records.find(x => x.id === id);
    if (r) {
      document.getElementById('fCliente').value = r.cliente;
      document.getElementById('fMovil').value = r.movil || '';
      document.getElementById('fFecha').value = r.fecha;
      document.getElementById('fMonto').value = r.monto;
      document.getElementById('fTasa').value = r.tasa;
      document.getElementById('fPlazo').value = r.plazo;
      document.getElementById('fFechaPago').value = r.fechaPago;
    }
  } else {
    document.getElementById('fCliente').value = '';
    document.getElementById('fMovil').value = '';
    document.getElementById('fMonto').value = '';
    document.getElementById('fTasa').value = '';
    document.getElementById('fFecha').value = today();
    document.getElementById('fPlazo').value = '30';
    document.getElementById('fFechaPago').value = addDays(today(), 30);
  }
  calcPreview();
  document.getElementById('formPanel').style.display = 'block';
  document.getElementById('formPanel').scrollIntoView({ behavior:'smooth' });
}
function hideForm() { document.getElementById('formPanel').style.display = 'none'; editingId = null; }

function calcPreview() {
  const m = parseFloat(document.getElementById('fMonto').value) || 0;
  const t = parseFloat(document.getElementById('fTasa').value) || 0;
  const p = parseInt(document.getElementById('fPlazo').value) || 30;
  document.getElementById('prevInteres').textContent = fmtCurrency(m * (t/100));
  document.getElementById('prevDiario').textContent = fmtCurrency((m * (t/100)) / 30);
  document.getElementById('prevTotal').textContent = fmtCurrency(m + (m * (t/100)));
  if (!editingId && document.getElementById('fFecha').value) {
    document.getElementById('fFechaPago').value = addDays(document.getElementById('fFecha').value, p);
  }
}

async function saveRecord() {
  const c = document.getElementById('fCliente').value.trim();
  const m = document.getElementById('fMovil').value.trim();
  const f = document.getElementById('fFecha').value;
  const mo = parseFloat(document.getElementById('fMonto').value) || 0;
  const ta = parseFloat(document.getElementById('fTasa').value) || 0;
  const pl = parseInt(document.getElementById('fPlazo').value) || 30;
  const fp = document.getElementById('fFechaPago').value;

  if(!c || !f || mo <= 0 || !fp) { toast('Por favor llene todos los campos'); return; }

  const data = {
    id: editingId || (Date.now().toString(36) + Math.random().toString(36).slice(2)),
    cliente: c, movil: m, fecha: f, monto: mo, tasa: ta, plazo: pl, fechaPago: fp,
    pagado: editingId ? records.find(x=>x.id===editingId).pagado : false,
    pagos: editingId ? records.find(x=>x.id===editingId).pagos : []
  };

  await window._fsWrite(data);
  toast('Guardado con éxito');
  hideForm();
}

function showPaymentForm(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  tipoPago = 'intereses';
  document.getElementById('fPagoId').value = id;
  document.getElementById('fPagoFecha').value = today();
  document.getElementById('fPagoNota').value = '';
  document.getElementById('pagoClienteNombre').textContent = r.cliente;
  setTipoPago('intereses');
  document.getElementById('paymentPanel').style.display = 'block';
  document.getElementById('paymentPanel').scrollIntoView({ behavior:'smooth' });
}
function hidePaymentForm() { document.getElementById('paymentPanel').style.display = 'none'; }

function setTipoPago(t) {
  tipoPago = t;
  ['btnTipoIntereses','btnTipoParcial','btnTipoTotal'].forEach(b => document.getElementById(b).classList.remove('active'));
  if(t==='intereses') document.getElementById('btnTipoIntereses').classList.add('active');
  if(t==='parcial') document.getElementById('btnTipoParcial').classList.add('active');
  if(t==='total') document.getElementById('btnTipoTotal').classList.add('active');
  recalcPago();
}

function recalcPago() {
  const r = records.find(x => x.id === document.getElementById('fPagoId').value); if(!r) return;
  const f = document.getElementById('fPagoFecha').value || today();
  const d = Math.max(0, daysDiff(getFechaRef(r), f));
  const intHoy = (r.monto * (r.tasa/100) / 30) * d;

  document.getElementById('pagoDias').textContent = d + ' días';
  document.getElementById('pagoInteresHoy').textContent = fmtCurrency(intHoy);
  document.getElementById('pagoCapital').textContent = fmtCurrency(r.monto);

  if (tipoPago === 'intereses') {
    document.getElementById('fPagoMonto').value = intHoy.toFixed(2);
    document.getElementById('pagoExplicacion').innerHTML = `Cobro de intereses devengados. El capital sigue congelado.`;
  } else if (tipoPago === 'total') {
    document.getElementById('fPagoMonto').value = (r.monto + intHoy).toFixed(2);
    document.getElementById('pagoExplicacion').innerHTML = `Liquidación final del préstamo.`;
  } else {
    document.getElementById('fPagoMonto').value = (intHoy + 50).toFixed(2);
    recalcPagoManual();
  }
}

function recalcPagoManual() {
  if (tipoPago !== 'parcial') return;
  const r = records.find(x => x.id === document.getElementById('fPagoId').value); if(!r) return;
  const d = Math.max(0, daysDiff(getFechaRef(r), document.getElementById('fPagoFecha').value));
  const intHoy = (r.monto * (r.tasa/100) / 30) * d;
  const mi = parseFloat(document.getElementById('fPagoMonto').value) || 0;
  
  if(mi < intHoy) {
    document.getElementById('pagoExplicacion').innerHTML = `<span style="color:var(--red)">No cubre el interés generado de ${fmtCurrency(intHoy)}</span>`;
  } else {
    document.getElementById('pagoExplicacion').innerHTML = `Amortiza ${fmtCurrency(mi - intHoy)} al capital principal.`;
  }
}

async function savePayment() {
  const id = document.getElementById('fPagoId').value;
  const r = records.find(x => x.id === id);
  const f = document.getElementById('fPagoFecha').value;
  const m = parseFloat(document.getElementById('fPagoMonto').value) || 0;
  const n = document.getElementById('fPagoNota').value;

  const intHoy = (r.monto * (r.tasa/100) / 30) * Math.max(0, daysDiff(getFechaRef(r), f));
  const pList = [...r.pagos];

  if(tipoPago === 'intereses') {
    pList.push({ fecha: f, monto: m, nota: n || 'Intereses', tipo: 'intereses' });
    await window._fsWrite({ ...r, pagos: pList, fechaPago: addDays(f, r.plazo) });
  } else if(tipoPago === 'total') {
    pList.push({ fecha: f, monto: m, nota: n || 'Liquidación', tipo: 'total' });
    await window._fsWrite({ ...r, pagos: pList, pagado: true });
  } else {
    if(m < intHoy) { toast('Monto insuficiente'); return; }
    const am = m - intHoy;
    pList.push({ fecha: f, monto: m, nota: n || 'Abono parcial', tipo: 'parcial', capitalAmortizado: am });
    await window._fsWrite({ ...r, monto: Math.max(0, r.monto - am), pagos: pList, fechaPago: addDays(f, r.plazo), pagado: (r.monto - am <= 0) });
  }
  toast('Pago registrado con éxito');
  hidePaymentForm();
}

function showDetail(id) {
  const r = records.find(x => x.id === id); if (!r) return;
  const s = calcStatus(r);
  const d = Math.max(0, daysDiff(getFechaRef(r), today()));
  const intAcum = (r.monto * (r.tasa/100) / 30) * d;

  document.getElementById('detailOverlay').innerHTML = `
    <div class="detail-card">
      <div class="detail-header">
        <div>
          <div class="detail-name">${escHtml(r.cliente)}</div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px;">📱 ${r.movil || 'Sin número'}</div>
          <div style="margin-top:6px;"><span class="badge ${STATUS_CLASS[s]}">${STATUS_LABEL[s]}</span></div>
        </div>
        <button class="btn-icon" onclick="closeDetail()"><i class="ti ti-x"></i></button>
      </div>
      <div class="detail-grid">
        <div class="detail-item"><div class="di-label">Capital Actual</div><div class="di-val">${fmtCurrency(r.monto)}</div></div>
        <div class="detail-item"><div class="di-label">Int. Acumulado</div><div class="di-val orange">${fmtCurrency(intAcum)}</div></div>
        <div class="detail-item"><div class="di-label">Vencimiento</div><div class="di-val">${fmtDate(r.fechaPago)}</div></div>
        <div class="detail-item"><div class="di-label">Total Cobrado</div><div class="di-val green">${fmtCurrency(getTotalCobrado(r))}</div></div>
      </div>
      <div class="detail-actions">
        ${!isCanceled(r) ? `
          <button class="btn btn-info" onclick="showPaymentForm('${r.id}')"><i class="ti ti-cash"></i> Cobrar / Abonar</button>
          ${r.movil ? `<button class="btn btn-success" style="background:#22C55E;color:#fff;" onclick="dispararRecordatorioMora('${r.id}')"><i class="ti ti-brand-whatsapp"></i> Cobrar por WhatsApp</button>` : ''}
        ` : ''}
        <button class="btn btn-secondary" onclick="showForm('${r.id}')"><i class="ti ti-edit"></i> Editar Datos</button>
        <button class="btn btn-danger-soft" onclick="deleteRecord('${r.id}')"><i class="ti ti-trash"></i> Eliminar Registro</button>
      </div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('show'); }

async function deleteRecord(id) {
  if(confirm('¿Eliminar definitivamente de Firebase?')) {
    await window._fsDelete(id); toast('Eliminado'); closeDetail();
  }
}

function renderStats() {
  const activos = records.filter(r => !isCanceled(r));
  const cap = activos.reduce((s,r)=>s+r.monto, 0);
  const intH = activos.reduce((s,r)=>s+getInteresHasta(r,today()), 0);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card info">
      <div class="sc-head"><div class="sc-label">Capital Vivo</div></div>
      <div class="sc-val">${fmtCurrency(cap)}</div>
      <div class="sc-hint">${activos.length} deudores</div>
    </div>
    <div class="stat-card success">
      <div class="sc-head"><div class="sc-label">Intereses Hoy</div></div>
      <div class="sc-val" style="color:var(--orange)">${fmtCurrency(intH)}</div>
      <div class="sc-hint">Por cobrar</div>
    </div>
  `;
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const fil = document.getElementById('filterStatus').value;
  const filtered = records.filter(r => {
    return r.cliente.toLowerCase().includes(q) && (!fil || calcStatus(r) === fil);
  });

  const tbody = document.getElementById('tableBody');
  if(!filtered.length) { tbody.innerHTML = ''; document.getElementById('emptyState').style.display='block'; return; }
  document.getElementById('emptyState').style.display='none';

  tbody.innerHTML = filtered.map(r => {
    const s = calcStatus(r);
    const intHoy = getInteresHasta(r, today());
    const dR = daysDiff(today(), r.fechaPago);

    return `<tr>
      <td class="td-name" onclick="showDetail('${r.id}')">${escHtml(r.cliente)}</td>
      <td class="td-mono">${fmtCurrency(r.monto)}</td>
      <td class="td-mono">${fmtDate(r.fechaPago)}${s==='vencido'?`<div class="td-mora">${Math.abs(dR)}d mora</div>`:''}</td>
      <td class="td-mono" style="color:var(--orange)">${s==='pagado'?'—':fmtCurrency(intHoy)}</td>
      <td><span class="badge ${STATUS_CLASS[s]}">${STATUS_LABEL[s]}</span></td>
      <td>
        <div style="display:flex;gap:4px">
          ${(!isCanceled(r) && r.movil) ? `<button class="btn-icon whatsapp" onclick="dispararRecordatorioMora('${r.id}')"><i class="ti ti-brand-whatsapp"></i></button>` : `<button class="btn-icon" onclick="showDetail('${r.id}')"><i class="ti ti-eye"></i></button>`}
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderAll() { renderStats(); renderTable(); }

function exportCSV() {
  const rows = records.map(r => [r.cliente, r.fecha, r.monto, r.tasa, r.fechaPago, STATUS_LABEL[calcStatus(r)]]);
  const csv = '\ufeff' + [['Cliente','Fecha','Monto','Tasa','Vence','Estado'],...rows].map(e=>e.join(';')).join('\n');
  const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})), download:`prestamos.csv`});
  document.body.appendChild(link); link.click(); link.remove();
}

document.getElementById('topDate').textContent = fmtDate(today());
</script>
</body>
</html>
